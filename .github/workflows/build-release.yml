name: 🔨 Build & Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      version:
        description: "版本號 (例如 v1.0.0)，留空則自動生成"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # 1. 自動生成版本 Tag
  # ─────────────────────────────────────────────
  auto-tag:
    name: 🏷️ Auto Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            DATE=$(date +'%Y.%m.%d')
            COUNT=$(git rev-list --count HEAD)
            VERSION="v${DATE}.${COUNT}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Version: ${VERSION}"

      - name: Create & push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 若 tag 已存在（重跑同一 commit）則跳過，其他錯誤仍中止
          if git rev-parse "refs/tags/${{ steps.tag.outputs.version }}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${{ steps.tag.outputs.version }} already exists, skipping"
          else
            git tag "${{ steps.tag.outputs.version }}"
            git push origin "${{ steps.tag.outputs.version }}"
          fi

  # ─────────────────────────────────────────────
  # 2. 多平台 Nuitka 打包
  # ─────────────────────────────────────────────
  build:
    name: 🛠️ Build [${{ matrix.name }}]
    needs: auto-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            name: windows-x64

          # Linux x64
          - os: ubuntu-22.04
            name: linux-x64

          # Linux ARM64 (GitHub native ARM64 runner)
          - os: ubuntu-22.04-arm
            name: linux-arm64

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Linux 系統依賴 ──
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 \
            libusb-1.0-0-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            patchelf \
            qt6-base-dev \
            qmake6 \
            imagemagick

      # ── macOS 系統依賴 ──
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      # ── Python 套件 ──
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt

      # ── macOS libusb fix (需在 pip install 之後，libusb_package 才存在) ──
      - name: Fix libusb dylib for Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          LIBUSB_PKG=$(python -c "import libusb_package, os; print(os.path.dirname(libusb_package.__file__))")
          cp -L "$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" "$LIBUSB_PKG/libusb-1.0.dylib"
          install_name_tool -id "@loader_path/libusb-1.0.dylib" "$LIBUSB_PKG/libusb-1.0.dylib"

      # ── Nuitka 打包 (全平台) ──
      # windows-console-mode 在 macOS/Linux 會被忽略，無需分開兩個 step
      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main_desktop.py
          enable-plugins: pyside6
          include-package: |
            app
            usb
            libusb_package
          include-package-data: libusb_package
          windows-console-mode: disable
          output-dir: build
        env:
          PYTHONPATH: ./backend

      # ── 準備輸出目錄 ──
      - name: Prepare output directory
        shell: bash
        run: mkdir -p dist-files

      # ── Windows 打包：portable zip + Inno Setup installer ──
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          # Nuitka --mode=app on Windows: exe 在 build/ 外，dist/ 在旁邊
          # 需要把 exe + dist/ 一起放進 staging 目錄，保持相對路徑
          mkdir -p staging
          cp build/main_desktop.exe staging/
          cp -r build/main_desktop.dist staging/
          # Portable zip
          (cd staging && 7z a "../dist-files/P710BT-Auto-windows-x64.zip" . > /dev/null)
          # Inno Setup installer (.exe)
          cat > setup.iss << EOF
          [Setup]
          AppName=P710BT-Auto
          AppVersion=${VERSION}
          DefaultDirName={autopf}\\P710BT-Auto
          DefaultGroupName=P710BT-Auto
          OutputDir=dist-files
          OutputBaseFilename=P710BT-Auto-windows-x64-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          [Files]
          Source: "staging\\main_desktop.exe"; DestDir: "{app}"
          Source: "staging\\main_desktop.dist\\*"; DestDir: "{app}\\main_desktop.dist"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\P710BT-Auto"; Filename: "{app}\\main_desktop.exe"
          Name: "{commondesktop}\\P710BT-Auto"; Filename: "{app}\\main_desktop.exe"
          [Run]
          Filename: "{app}\\main_desktop.exe"; Description: "Launch P710BT-Auto"; Flags: nowait postinstall skipifsilent
          EOF
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" setup.iss

      # ── Linux 打包：AppImage + deb ──
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          NAME="${{ matrix.name }}"
          VERSION="${{ needs.auto-tag.outputs.version }}"
          DEB_VERSION="${VERSION#v}"
          case "$ARCH" in x86_64) DEB_ARCH="amd64" ;; aarch64) DEB_ARCH="arm64" ;; esac

          # AppImage
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage" -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir
          cp -r build/main_desktop.dist/* AppDir/
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "${HERE}/main_desktop" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '[Desktop Entry]\nName=P710BT-Auto\nExec=main_desktop\nIcon=main_desktop\nType=Application\nCategories=Utility;\n' > AppDir/main_desktop.desktop
          convert -size 256x256 xc:#1565C0 AppDir/main_desktop.png
          ARCH=$ARCH APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist-files/P710BT-Auto-${NAME}.AppImage"

          # DEB
          PKG="pkg-deb"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/local/lib/p710bt-auto" "${PKG}/usr/local/bin" "${PKG}/usr/share/applications"
          cp -r build/main_desktop.dist/* "${PKG}/usr/local/lib/p710bt-auto/"
          printf '#!/bin/bash\nexec /usr/local/lib/p710bt-auto/main_desktop "$@"\n' > "${PKG}/usr/local/bin/p710bt-auto"
          chmod +x "${PKG}/usr/local/bin/p710bt-auto"
          printf '[Desktop Entry]\nName=P710BT-Auto\nExec=p710bt-auto\nIcon=p710bt-auto\nType=Application\nCategories=Utility;\n' > "${PKG}/usr/share/applications/p710bt-auto.desktop"
          printf "Package: p710bt-auto\nVersion: ${DEB_VERSION}\nArchitecture: ${DEB_ARCH}\nMaintainer: Wing9897\nDescription: Brother Label Printer Desktop Tool\n" > "${PKG}/DEBIAN/control"
          dpkg-deb --build "${PKG}" "dist-files/P710BT-Auto-${NAME}.deb"

      # ── macOS 打包：DMG ──
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "P710BT-Auto" \
            -srcfolder "build/main_desktop.app" \
            -ov -format UDZO \
            "dist-files/P710BT-Auto-${{ matrix.name }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-files/
          retention-days: 1

  # ─────────────────────────────────────────────
  # 3. 把瀏覽器版發佈到 GitHub Pages
  # ─────────────────────────────────────────────
  pages:
    name: 🌐 Publish Web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # 4. 自動建立 GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: 🚀 Create Release
    needs: [auto-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: List release files
        run: ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-tag.outputs.version }}
          name: "🚀 Release ${{ needs.auto-tag.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
          body: |
            ## 📦 P710BT-Auto WebUI — ${{ needs.auto-tag.outputs.version }}

            ### 支援平台 / Supported Platforms

            | 平台 | 架構 | 格式 | 檔案 |
            |------|------|------|------|
            | Windows | x64 | 免安裝 portable | `P710BT-Auto-windows-x64.zip` |
            | Windows | x64 | 安裝程式 | `P710BT-Auto-windows-x64-setup.exe` |
            | Linux | x64 | AppImage (免安裝) | `P710BT-Auto-linux-x64.AppImage` |
            | Linux | x64 | DEB 安裝包 | `P710BT-Auto-linux-x64.deb` |
            | Linux | arm64 | AppImage (免安裝) | `P710BT-Auto-linux-arm64.AppImage` |
            | Linux | arm64 | DEB 安裝包 | `P710BT-Auto-linux-arm64.deb` |
            | macOS | arm64 (Apple Silicon + Intel via Rosetta 2) | DMG | `P710BT-Auto-macos-arm64.dmg` |

            ### 瀏覽器版
            用 Chrome 或 Edge 打開，可安裝到電腦離線使用：
            https://wing9897.github.io/P710BT-Auto_webUI/

            ### 使用說明
            - **瀏覽器**: 打開上面的網址。Windows 需先用 Zadig 安裝 WinUSB
            - **Windows (portable)**: 解壓縮 `.zip`，執行 `main_desktop.exe`
            - **Windows (installer)**: 執行 `setup.exe`，依指示安裝，桌面會出現捷徑
            - **Linux AppImage**: `chmod +x *.AppImage` 後直接執行
            - **Linux DEB**: `sudo dpkg -i *.deb` 後執行 `p710bt-auto`
            - **macOS**: 開啟 `.dmg`，雙擊 `main_desktop.app`
