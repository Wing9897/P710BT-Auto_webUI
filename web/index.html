<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <meta name="description" content="在自己的瀏覽器裡設計 Brother 標籤，並用 USB 直接列印。資料不會上傳。">
  <title>P710BT 標籤列印</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="40" height="40">
      <div>
        <h1>P710BT 標籤列印</h1>
        <p>在這部電腦的瀏覽器裡運作，資料不會上傳。可安裝後離線使用。</p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="install-btn" class="ghost" hidden>安裝到這部電腦</button>
      <a class="ghost" href="https://github.com/Wing9897/P710BT-Auto_webUI/releases/latest" target="_blank" rel="noopener">下載桌面程式</a>
    </div>
  </header>

  <p id="context-note" class="banner" hidden></p>

  <main>
    <section class="card data-card">
      <h2>貼上資料</h2>
      <div class="row">
        <label>格式
          <select id="format-select">
            <option value="json">JSON</option>
            <option value="csv" selected>CSV</option>
            <option value="delimited">自訂分隔符</option>
          </select>
        </label>
        <label id="delim-label" hidden>分隔符
          <input id="delim-input" type="text" maxlength="3" placeholder="," value="|">
        </label>
      </div>
      <textarea id="paste-input" rows="6" placeholder="貼上資料。例如 CSV：&#10;name,price&#10;蘋果,12&#10;&#10;或 JSON：[{&quot;name&quot;:&quot;蘋果&quot;,&quot;price&quot;:&quot;12&quot;}]"></textarea>
      <div class="row">
        <button type="button" id="parse-btn" class="primary">解析</button>
        <button type="button" id="sample-btn" class="ghost">載入範例</button>
        <button type="button" id="file-btn" class="ghost">開啟檔案</button>
        <input id="file-input" type="file" accept=".csv,.tsv,.txt,.json,.xlsx,.xls" hidden>
        <span id="file-label" class="muted">支援 Excel、JSON、CSV</span>
      </div>
      <p id="error-box" class="error" hidden></p>

      <div class="table-head">
        <h2>資料預覽</h2>
        <button type="button" id="delete-btn" class="danger" disabled>刪除選中</button>
      </div>
      <div id="columns" class="columns" hidden></div>
      <div class="table-wrap">
        <table id="data-table" tabindex="0">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="count-label" class="muted">尚未載入資料。表格最多顯示前 50 筆，列印會用全部。</p>
    </section>

    <section class="side">
      <section class="card">
        <h2>標籤設定</h2>
        <div class="settings">
          <label>膠帶
            <select id="tape-select">
              <option value="4">3.5 mm</option>
              <option value="6">6 mm</option>
              <option value="9">9 mm</option>
              <option value="12">12 mm</option>
              <option value="18">18 mm</option>
              <option value="24" selected>24 mm</option>
            </select>
          </label>
          <label>字型
            <select id="font-select">
              <option value='"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif'>系統預設</option>
              <option value='"Microsoft JhengHei", sans-serif'>微軟正黑體</option>
              <option value='"Microsoft YaHei", sans-serif'>微軟雅黑</option>
              <option value='"PingFang TC", "PingFang HK", sans-serif'>蘋方</option>
              <option value="Arial, sans-serif">Arial</option>
            </select>
          </label>
          <label>大小
            <input id="font-size" type="number" min="0" max="200" value="0" title="0 代表自動">
          </label>
          <label>邊距
            <input id="margin-input" type="number" min="0" max="50" value="8">
          </label>
        </div>
        <p class="muted">大小填 0 會自動縮放。每一欄可以改成文字、QR 或條碼。</p>
      </section>

      <section class="card preview-card">
        <div class="table-head">
          <h2>預覽</h2>
          <div class="row">
            <button type="button" id="refresh-btn" class="ghost">重新整理</button>
            <button type="button" id="full-btn" class="ghost" disabled>完整顯示</button>
          </div>
        </div>
        <button type="button" id="preview-stage" class="preview-stage">
          <img id="preview-img" alt="標籤預覽" hidden>
          <span id="preview-empty">尚無預覽</span>
        </button>
        <div id="nav" class="nav" hidden>
          <button type="button" id="prev-btn" aria-label="上一張">◀</button>
          <span id="nav-label">1 / 1</span>
          <button type="button" id="next-btn" aria-label="下一張">▶</button>
        </div>
      </section>

      <section class="card">
        <h2>列印</h2>
        <p class="muted">用 Chrome 或 Edge。Windows 需先用 Zadig 把打印機換成 WinUSB，和桌面程式一樣。</p>
        <div class="row">
          <label class="grow">印表機
            <select id="printer-select">
              <option value="">尚未連接</option>
            </select>
          </label>
          <button type="button" id="connect-btn">連接</button>
        </div>
        <p id="tape-info" class="ok" hidden></p>
        <div class="row">
          <label>列印邊距（點）
            <input id="print-margin" type="number" min="0" max="500" value="0">
          </label>
        </div>
        <label class="check">
          <input id="chain-check" type="checkbox" checked>
          連續列印（中間不裁切，節省膠帶）
        </label>
        <button type="button" id="print-btn" class="print" disabled>列印 0 張標籤</button>
        <progress id="progress" hidden value="0" max="1"></progress>
        <p id="result" hidden></p>
      </section>
    </section>
  </main>

  <p id="status" class="status">就緒</p>

  <dialog id="full-dialog">
    <p id="full-caption"></p>
    <img id="full-img" alt="放大的標籤預覽">
    <form method="dialog"><button class="primary">關閉</button></form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
